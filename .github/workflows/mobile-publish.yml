name: Build and publish mobile preview
on:
  workflow_dispatch:
    inputs:
      engine_run:
        type: string
        default: "40939175466"
      publish:
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: mobile-site
  cancel-in-progress: false
jobs:
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: mobile-browser-runtime
          path: browser-runtime
          run-id: ${{ inputs.engine_run }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: mobile-native
          path: mobile-native
          run-id: ${{ inputs.engine_run }}
          github-token: ${{ github.token }}
      - name: Assemble verified original game and mobile interface
        run: python3 mobile/prepare_site.py --engine browser-runtime --native mobile-native --output mobile-web
      - name: Install cloud browser tooling
        run: |
          npm install --no-save playwright@1.56.1 pngjs@7.0.0
          npx playwright install --with-deps chromium
      - name: Test actual mobile game and touch controls
        run: node mobile/test_site.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: mobile-site-test-results
          path: mobile-test-results/
          retention-days: 7
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: mobile-web
          retention-days: 7
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
        with:
          gradle-version: '8.11.1'
      - name: Restore protected release signing key
        env:
          KEYSTORE: ${{ secrets.JOEY_ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE"
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/joey-release.p12"
          chmod 600 "$RUNNER_TEMP/joey-release.p12"
      - name: Build signed Android installer
        working-directory: mobile/android
        env:
          JOEY_KEYSTORE_FILE: ${{ runner.temp }}/joey-release.p12
          JOEY_KEYSTORE_PASSWORD: ${{ secrets.JOEY_ANDROID_KEYSTORE_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease :app:lintRelease
      - name: Verify installer signature
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose mobile/android/app/build/outputs/apk/release/app-release.apk
          cp mobile/android/app/build/outputs/apk/release/app-release.apk Joey-Online-Android.apk
          sha256sum Joey-Online-Android.apk > Joey-Online-Android.apk.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mobile-android
          path: |
            Joey-Online-Android.apk
            Joey-Online-Android.apk.sha256
          retention-days: 7
      - name: Remove temporary signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/joey-release.p12"
  deploy:
    if: inputs.publish
    needs: [site, android]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish tested mobile game
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
