name: Multiplayer checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-and-cloud:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Install backend tooling
        working-directory: cloud
        run: npm ci
      - name: Validate backend
        working-directory: cloud
        shell: pwsh
        run: |
          npx wrangler types
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm test
          exit $LASTEXITCODE
      - name: Compile native module and test program
        shell: pwsh
        run: ./native/Build.ps1
      - name: Start test backend
        shell: pwsh
        run: |
          $project = Join-Path $env:GITHUB_WORKSPACE 'cloud'
          $server = Start-Process node -ArgumentList @('.\node_modules\wrangler\bin\wrangler.js','dev','--local','--port','8787','--ip','127.0.0.1','--log-level','warn','--persist-to','.test-state') -WorkingDirectory $project -WindowStyle Hidden -PassThru -RedirectStandardOutput (Join-Path $project 'test-service.log') -RedirectStandardError (Join-Path $project 'test-service-error.log')
          $server.Id | Set-Content (Join-Path $project 'test-service.pid')
          for ($attempt = 0; $attempt -lt 30; $attempt++) {
            try { Invoke-RestMethod 'http://127.0.0.1:8787/health' | Out-Null; exit 0 } catch { Start-Sleep -Seconds 1 }
          }
          Get-Content (Join-Path $project 'test-service-error.log')
          throw 'Backend did not become ready.'
      - name: Test live room service
        working-directory: cloud
        env:
          TEST_SERVER: http://127.0.0.1:8787
        run: npm test
      - name: Test native hosting and joining
        shell: pwsh
        run: |
          & ./native/build/native-check.exe 'http://127.0.0.1:8787'
          exit $LASTEXITCODE
      - name: Package Worker without deploying
        working-directory: cloud
        run: npx wrangler deploy --dry-run
      - name: Stop test backend
        if: always()
        shell: pwsh
        run: |
          $pidFile = Join-Path $env:GITHUB_WORKSPACE 'cloud/test-service.pid'
          if (Test-Path $pidFile) {
            $serverId = [int](Get-Content $pidFile)
            Stop-Process -Id $serverId -ErrorAction SilentlyContinue
          }
          $logFile = Join-Path $env:GITHUB_WORKSPACE 'cloud/test-service-error.log'
          if (Test-Path $logFile) { Get-Content $logFile -Tail 40 }
