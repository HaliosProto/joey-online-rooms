name: Multiplayer checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-and-cloud:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Install backend tooling
        working-directory: cloud
        run: npm ci
      - name: Validate backend
        working-directory: cloud
        shell: pwsh
        run: |
          npx wrangler types
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm test
          exit $LASTEXITCODE
      - name: Compile native module and test program
        shell: pwsh
        run: ./native/Build.ps1
      - name: Test live service and native hosting and joining
        working-directory: cloud
        run: npm run test:integration -- --native ../native/build/native-check.exe
      - name: Package Worker without deploying
        working-directory: cloud
        run: npx wrangler deploy --dry-run
