name: Probe original game on mobile browser runtime
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - shell: pwsh
        run: ./native/Build.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mobile-native
          path: |
            native/build/native-check.exe
            native/build/dinput.dll
          retention-days: 2
  browser:
    needs: native
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: danoon2/Boxedwine
          ref: 8790ff20428c22daa64368af9553417e4f499c94
          path: boxedwine
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: mobile-native
          path: mobile-native
      - name: Install pinned WebAssembly compiler
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install 6.0.13
          "$RUNNER_TEMP/emsdk/emsdk" activate 6.0.13
      - name: Build portable browser runtime
        working-directory: boxedwine/project/emscripten
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          make -j4 jit WASM_EXCEPTIONS_FLAG=-fwasm-exceptions TAIL_CALL_FLAG=
      - name: Prepare verified game and runtime files
        run: python3 mobile/prepare_probe.py --engine boxedwine/project/emscripten/Build/Jit --native mobile-native --output mobile-web
      - name: Install cloud browser tooling
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Exercise the original game in the browser
        run: node mobile/probe_browser.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: mobile-browser-results
          path: mobile-test-results/
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: mobile-browser-runtime
          path: |
            boxedwine/project/emscripten/Build/Jit/*.js
            boxedwine/project/emscripten/Build/Jit/*.html
            boxedwine/project/emscripten/Build/Jit/*.css
            boxedwine/project/emscripten/Build/Jit/*.wasm
          retention-days: 2
