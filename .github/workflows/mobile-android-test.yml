name: Exercise Android preview in cloud emulator
on:
  workflow_dispatch:
    inputs:
      build_run:
        type: string
        required: true
permissions:
  contents: read
  actions: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: mobile-android
          path: android-installer
          run-id: ${{ inputs.build_run }}
          github-token: ${{ github.token }}
      - name: Prepare official Android 15 emulator
        timeout-minutes: 8
        run: |
          export PATH="$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          sudo chmod 666 /dev/kvm
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'system-images;android-35;google_apis;x86_64'
          export ANDROID_AVD_HOME="$RUNNER_TEMP/joey-avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd --force -n joey -k 'system-images;android-35;google_apis;x86_64' -p "$ANDROID_AVD_HOME/joey.avd"
          printf 'avd.ini.encoding=UTF-8\npath=%s\n' "$ANDROID_AVD_HOME/joey.avd" > "$ANDROID_AVD_HOME/joey.ini"
          "$ANDROID_HOME/emulator/emulator" -avd joey -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -memory 3072 -dns-server 8.8.8.8,1.1.1.1 > /tmp/joey-emulator.log 2>&1 &
          JOEY_EMULATOR_PID=$!
          adb start-server
          for i in $(seq 1 120); do
            if ! kill -0 "$JOEY_EMULATOR_PID" 2>/dev/null; then cat /tmp/joey-emulator.log; exit 1; fi
            if [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = '1' ]; then break; fi
            sleep 2
          done
          if [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" != '1' ]; then cat /tmp/joey-emulator.log; adb devices -l; exit 1; fi
          adb shell settings put global private_dns_mode off
          adb shell settings put secure immersive_mode_confirmations confirmed
          adb shell svc wifi enable
          sleep 15
          adb shell input keyevent 82
          adb shell settings put system accelerometer_rotation 0
          adb shell settings put system user_rotation 1
          adb install android-installer/Joey-Online-Android.apk
      - name: Download and start the actual game in Android WebView
        run: python3 mobile/test_android.py
      - name: Preserve emulator startup diagnostics
        if: always()
        run: |
          mkdir -p android-test-results
          cp /tmp/joey-emulator.log android-test-results/emulator.log || true
          adb devices -l > android-test-results/devices.txt || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: android-device-test-results
          path: android-test-results/
          retention-days: 7
