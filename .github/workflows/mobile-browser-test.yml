name: Test cached mobile browser runtime
on:
  workflow_dispatch:
    inputs:
      engine_run:
        type: string
        default: "40950950768"
      browser:
        type: choice
        options: [chromium, webkit]
        default: chromium
      check:
        type: choice
        options: [game, network, frontend]
        default: game
permissions:
  contents: read
  actions: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: mobile-browser-runtime
          path: browser-runtime
          run-id: ${{ inputs.engine_run }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: mobile-native
          path: mobile-native
          run-id: ${{ inputs.engine_run }}
          github-token: ${{ github.token }}
      - name: Prepare verified game files
        run: python3 ${{ inputs.check == 'frontend' && 'mobile/prepare_site.py' || 'mobile/prepare_probe.py' }} --engine browser-runtime --native mobile-native --output mobile-web
      - name: Install cloud browser tooling
        run: |
          npm install --no-save playwright@1.56.1 pngjs@7.0.0
          npx playwright install --with-deps ${{ inputs.browser }}
      - name: Start the isolated cloud room test service
        if: inputs.check == 'network'
        run: |
          cd cloud
          npm ci
          node node_modules/wrangler/bin/wrangler.js dev --local --port 8787 > /tmp/joey-service.log 2>&1 &
          node --input-type=module -e 'for(let i=0;i<60;i++){try{if((await fetch("http://127.0.0.1:8787/health")).ok)process.exit(0);}catch{}await new Promise(r=>setTimeout(r,1000));}process.exit(1);'
      - name: Exercise the original game in the browser
        env:
          MOBILE_BROWSER: ${{ inputs.browser }}
          MOBILE_CHECK: ${{ inputs.check }}
          TEST_SERVER: ${{ inputs.check == 'network' && 'http://127.0.0.1:8787' || '' }}
        run: node ${{ inputs.check == 'frontend' && 'mobile/test_site.mjs' || 'mobile/probe_browser.mjs' }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: mobile-browser-results
          path: mobile-test-results/
          retention-days: 7
